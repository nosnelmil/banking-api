openapi: 3.0.3
info:
  title: Accounts API
  version: "1.0.0"
paths:
  /accounts:
    post:
      summary: Create a new account
      responses:
        '201':
          description: Account created
  /accounts/{account_id}:
    get:
      responses:
        '200':
          description: Account found
        '404':
          description: Account not found
