openapi: 3.0.3
info:
  title: Accounts API
  version: "1.0.0"
paths:
  /accounts:
    post:
      responses:
        '201':  # already had this
          description: Account created
        '400':  # NEW
          description: Validation error
          headers:
            X-Trace-Id:  # NEW
              description: Unique ID for this request
              schema:
                type: string
  /accounts/{account_id}:
    get:
      responses:
        '200':
          description: Account found
        '404':
          description: Account not found
        '401':  # NEW
          description: Authentication required

